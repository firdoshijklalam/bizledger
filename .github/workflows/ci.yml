# CI/CD Pipeline for BizLedger
# Runs on every push to main + PRs. Vercel handles auto-deployment via its own
# GitHub integration (Production Deployments → main branch auto-deploy enabled).
# This workflow provides a build-quality gate so broken code is caught before
# Vercel deploys it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Lint + Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Lint
        run: bun run lint

      - name: Type check (non-blocking)
        run: bunx tsc --noEmit || true
        continue-on-error: true

  # Vercel Auto-Deploy reminder — this job documents the deploy step.
  # Vercel's native GitHub integration auto-deploys on push to main.
  # No manual deploy step needed here.
  deploy-info:
    name: Vercel Auto-Deploy Info
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Notify
        run: |
          echo "✅ CI passed. Vercel will auto-deploy from main branch."
          echo "Production URL: https://bizledger-liart.vercel.app/"
          echo "Commit: ${{ github.sha }}"
          echo "Vercel auto-deploys every push to main — no manual action needed."
